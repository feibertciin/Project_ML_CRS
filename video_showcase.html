<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Showcase Interactivo | Clasificación Inteligente de Residuos (CRS)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1120;
      --bg2: #0f1829;
      --card: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.08);
      --green: #10b981;
      --cyan:  #06b6d4;
      --blue:  #3b82f6;
      --text:  #f1f5f9;
      --muted: #94a3b8;
      --r: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    a { color: var(--green); text-decoration: none; transition: opacity 0.2s; }
    a:hover { opacity: 0.8; }

    .container { max-width: 980px; margin: 0 auto; padding: 0 16px; width: 100%; }

    /* Top bar */
    .top-strip {
      background: rgba(11,17,32,0.95);
      border-bottom: 1px solid rgba(16,185,129,0.15);
      padding: 12px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-row { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--green), var(--cyan));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #022c22;
    }
    .brand-icon svg { width: 18px; height: 18px; }
    .brand-name { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 0.95rem; color: #fff; }
    .brand-sub  { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--green); font-weight: 700; }

    .nav-actions { display: flex; gap: 8px; }
    .nav-btn {
      padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s; border: none; display: inline-flex;
      align-items: center; gap: 6px; text-decoration: none;
    }
    .nav-btn-ghost { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); color: var(--muted); }
    .nav-btn-ghost:hover { background: rgba(255,255,255,0.1); color: #fff; }

    /* Player Stage */
    .stage-wrapper {
      padding: 16px 0 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .player-wrap {
      background: linear-gradient(135deg, #0f1829, #0b2030);
      border: 1px solid rgba(16,185,129,0.25);
      border-radius: var(--r);
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }

    .player-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: rgba(0,0,0,0.35); border-bottom: 1px solid var(--border);
    }
    .scene-badge {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--green);
      background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25);
      padding: 3px 10px; border-radius: 999px;
    }
    .timecode {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem; color: var(--muted);
    }

    /* Screen Viewport */
    .screen-stage {
      position: relative;
      background: #060c18;
      aspect-ratio: 16/9;
      overflow: hidden;
      cursor: pointer;
    }
    #particle-canvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
    .screen-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 4%;
      z-index: 2;
      transition: opacity 0.4s ease;
      pointer-events: auto;
    }
    .screen-overlay.fade-out { opacity: 0; }

    .stage-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem; font-weight: 600; color: var(--green);
      text-transform: uppercase; letter-spacing: 0.12em;
      background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3);
      padding: 4px 14px; border-radius: 999px; margin-bottom: 14px;
    }
    .stage-title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.3rem, 3.6vw, 2.3rem);
      font-weight: 900; color: #fff; line-height: 1.25;
      margin-bottom: 10px;
    }
    .stage-title .accent { color: var(--green); }
    .stage-desc {
      font-size: clamp(0.75rem, 1.6vw, 0.92rem);
      color: #cbd5e1; line-height: 1.5; max-width: 580px; margin-bottom: 16px;
    }

    /* Elements */
    .stat-row {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    }
    .stat-card {
      background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3);
      color: #34d399; padding: 8px 16px; border-radius: 8px;
      font-family: 'Outfit', sans-serif; font-size: clamp(0.8rem, 1.8vw, 0.95rem);
      font-weight: 700; display: inline-flex; align-items: center; gap: 8px;
    }

    .pipeline-row {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      justify-content: center; margin-top: 10px;
    }
    .pipe-box {
      background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3);
      color: #34d399; padding: 6px 10px; border-radius: 6px;
      font-size: clamp(0.68rem, 1.4vw, 0.78rem); font-weight: 600;
      text-align: center; min-width: 65px;
    }
    .pipe-arr { color: var(--green); font-size: 1rem; }

    .compare-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
      width: 100%; max-width: 520px; margin-top: 10px;
    }
    .compare-box {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 12px;
    }
    .compare-box.green { border-color: rgba(16,185,129,0.4); }
    .compare-box.blue  { border-color: rgba(59,130,246,0.4); }
    .compare-title { font-size: 0.7rem; color: var(--muted); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .compare-pct {
      font-family: 'Outfit', sans-serif; font-size: clamp(1.4rem, 3.5vw, 1.8rem);
      font-weight: 900; line-height: 1; margin: 4px 0;
    }
    .compare-pct.green-text { color: var(--green); }
    .compare-pct.blue-text  { color: var(--blue); }
    .compare-sub { font-size: 0.7rem; color: var(--muted); }
    .bar-bg { width: 100%; height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-top: 6px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; width: 0; transition: width 1s ease-out; }

    /* Subtitles bar */
    .subtitles-bar {
      background: rgba(0,0,0,0.6); border-top: 1px solid var(--border);
      padding: 10px 16px; display: flex; align-items: center; gap: 10px;
    }
    .sub-icon { color: var(--green); flex-shrink: 0; }
    .sub-tag { font-size: 0.65rem; color: var(--green); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }
    .sub-text { font-size: 0.8rem; color: #e2e8f0; font-style: italic; line-height: 1.4; }

    /* Controls */
    .controls-strip {
      padding: 12px 16px;
      background: rgba(0,0,0,0.3); border-top: 1px solid var(--border);
    }
    .progress-bar {
      position: relative; height: 5px; background: rgba(255,255,255,0.1);
      border-radius: 3px; cursor: pointer; margin-bottom: 10px; overflow: hidden;
    }
    .progress-bar:hover { height: 7px; margin-top: -1px; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--cyan)); border-radius: 3px; width: 0; transition: width 0.25s linear; }

    .ctrl-buttons { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .ctrl-group-left { display: flex; align-items: center; gap: 8px; }
    .ctrl-group-right { display: flex; align-items: center; gap: 6px; }

    .btn-action {
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      border-radius: 8px; transition: all 0.2s ease;
    }
    .btn-play {
      width: 40px; height: 40px;
      background: var(--green); color: #022c22;
      box-shadow: 0 4px 12px rgba(16,185,129,0.35);
    }
    .btn-play:hover { background: #0d9268; transform: scale(1.05); }
    .btn-ghost-icon {
      width: 34px; height: 34px;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-ghost-icon:hover { background: rgba(255,255,255,0.1); color: #fff; }

    .step-btn {
      width: 28px; height: 28px; border-radius: 6px; font-size: 0.72rem;
      font-weight: 700; border: none; cursor: pointer; transition: all 0.2s;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--muted);
    }
    .step-btn.active { background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.4); color: var(--green); }
    .step-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

    /* Storyboard Row */
    .storyboard-row {
      margin-top: 16px;
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
    }
    .sb-item {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px; cursor: pointer;
      transition: all 0.2s ease;
    }
    .sb-item:hover { background: rgba(255,255,255,0.05); border-color: rgba(16,185,129,0.3); }
    .sb-item.active { border-color: var(--green); background: rgba(16,185,129,0.08); }
    .sb-tag { font-size: 0.65rem; font-weight: 700; color: var(--green); text-transform: uppercase; margin-bottom: 4px; }
    .sb-title { font-size: 0.74rem; font-weight: 600; color: #fff; line-height: 1.25; margin-bottom: 2px; }
    .sb-time { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); }

    @media (max-width: 640px) {
      .storyboard-row { grid-template-columns: repeat(3, 1fr); }
      .compare-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="top-strip">
  <div class="container" style="display:flex;align-items:center;justify-content:space-between;">
    <div class="brand-row">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"></path><path d="M11 19h8.2a1.8 1.8 0 0 0 1.6-1 1.8 1.8 0 0 0 0-1.8L17 9"></path><path d="m11 5 3.5 6"></path><path d="m2 13 3-4 3 4"></path><path d="m12 10 3 4 3-4"></path><path d="m17 21 3-4 3 4"></path></svg>

      <div class="subtitles-bar">

<script>
  // Canvas Particles
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  function initParticles(count = 50) {
    particles = [];
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.6 + 0.6,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        alpha: Math.random() * 0.45 + 0.15
      });
    }
  }
  function renderParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = canvas.width;
      if (p.x > canvas.width) p.x = 0;
      if (p.y < 0) p.y = canvas.height;
      if (p.y > canvas.height) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(16, 185, 129, ${p.alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(renderParticles);
  }
  window.addEventListener('resize', () => { resizeCanvas(); initParticles(); });
  resizeCanvas(); initParticles(); renderParticles();

  // Escenas del Storyboard
  const scenes = [
    {
      dur: 4,
      badge: 'ESCENA 1 / 5 · Datos del Proyecto',
      sub: '"2,527 imágenes de residuos convertidas en solo 4 variables tabulares con visión computacional clásica. 6 categorías de clasificación automática."',
      html: `
        <div class="stage-pill">01 · Adquisición de Datos</div>
        <div class="stage-title">De <span class="accent">2,527 Imágenes</span><br>a 4 Variables Numéricas</div>
        <div class="stage-desc">Garbage Classification v2 (Kaggle) · Extracción de características de bajo coste computacional</div>
        <div class="stat-row">
          <div class="stat-card">📷 2,527 Fotos</div>
          <div class="stat-card">🔢 4 Variables</div>
          <div class="stat-card">🏷️ 6 Clases</div>
        </div>
      `
    },
    {
      dur: 4,
      badge: 'ESCENA 2 / 5 · Pipeline ETL',
      sub: '"El pipeline ETL extrae la colorimetría RGB promedio y la densidad de bordes estructurales con el filtro Canny de OpenCV."',
      html: `
        <div class="stage-pill">02 · Pipeline ETL de Visión</div>
        <div class="stage-title">Del Píxel al <span class="accent">Feature Tabular</span></div>
        <div class="stage-desc">OpenCV · Extracción espectral RGB y densidad de gradiente de bordes</div>
        <div class="pipeline-row">
          <div class="pipe-box">📷 Foto<br><small>100×100</small></div>
          <div class="pipe-arr">→</div>
          <div class="pipe-box">🎨 RGB<br><small>mean_r,g,b</small></div>
          <div class="pipe-arr">→</div>
          <div class="pipe-box">🔍 Canny<br><small>edge_density</small></div>
          <div class="pipe-arr">→</div>
          <div class="pipe-box">📋 CSV<br><small>DataFrame</small></div>
          <div class="pipe-arr">→</div>
          <div class="pipe-box">🌳 RF<br><small>Modelo</small></div>
        </div>
      `
    },
    {
      dur: 4,
      badge: 'ESCENA 3 / 5 · Random Forest',
      sub: '"En la primera pestaña de Streamlit, se simula la inferencia del Random Forest con menos de 5 milisegundos de latencia en CPU básica."',
      html: `
        <div class="stage-pill">03 · Machine Learning Clásico</div>
        <div class="stage-title">Simulador <span class="accent">Random Forest</span><br>en Tiempo Real</div>
        <div class="stage-desc">Ensamble de 100 estimadores balanceados · Inferencia en milisegundos sin requerir acelerador GPU</div>
        <div class="stat-row">
          <div class="stat-card">🌳 100 Árboles</div>
          <div class="stat-card">⚡ &lt; 5 ms Latencia</div>
          <div class="stat-card">📊 62.8% Accuracy</div>
        </div>
      `
    },
    {
      dur: 4,
      badge: 'ESCENA 4 / 5 · Transfer Learning',
      sub: '"La segunda pestaña aplica MobileNetV2 preentrenada con ImageNet para clasificar botellas PET por tamaño con 91.4% de precisión."',
      html: `
        <div class="stage-pill">04 · Transfer Learning</div>
        <div class="stage-title"><span class="accent">MobileNetV2</span> vs.<br>Random Forest</div>
        <div class="stage-desc">1,280 dimensiones de embedding convolucional · Clasificación especializada para botellas PET</div>
        <div class="compare-grid">
          <div class="compare-box green">
            <div class="compare-title">🌳 Random Forest</div>
            <div class="compare-pct green-text" id="pctRf">62.8%</div>
            <div class="compare-sub">6 Clases · 4 Features Tabulares</div>
            <div class="bar-bg"><div class="bar-fill" id="barRf" style="background:var(--green);width:62.8%;"></div></div>
          </div>
          <div class="compare-box blue">
            <div class="compare-title">🧠 MobileNetV2 TL</div>
            <div class="compare-pct blue-text" id="pctTl">91.4%</div>
            <div class="compare-sub">3 Clases PET · 1,280 Embeddings</div>
            <div class="bar-bg"><div class="bar-fill" id="barTl" style="background:var(--blue);width:91.4%;"></div></div>
          </div>
        </div>
      `
    },
    {
      dur: 4,
      badge: 'ESCENA 5 / 5 · Despliegue en la Nube',
      sub: '"Código abierto en GitHub. Desplegado en Streamlit Community Cloud. Metodología CRISP-ML(Q) aplicada a la economía circular."',
      html: `
        <div class="stage-pill">05 · Despliegue y Gobernanza</div>
        <div class="stage-title">Código Abierto.<br><span class="accent">Desplegado en la Nube.</span></div>
        <div class="stage-desc">Plataforma interactiva validada · GitHub Pages y Streamlit Community Cloud</div>
        <div class="stat-row" style="margin-top:14px;">
          <a href="https://Project_ML_CRS.streamlit.app" target="_blank" class="stat-card" style="background:var(--green);color:#022c22;text-decoration:none;">⚡ Probar Streamlit</a>
          <a href="https://github.com/feibertciin/Project_ML_CRS.git" target="_blank" class="stat-card" style="background:rgba(255,255,255,0.08);color:#fff;text-decoration:none;">📂 Repositorio GitHub</a>
        </div>
      `
    }
  ];

  let currentIdx = 0;
  let isPlaying = false;
  let elapsed = 0;
  let rafId = null;
  let lastTime = null;

  const offsets = (() => {
    let acc = 0;
    return scenes.map(s => { const o = acc; acc += s.dur; return o; });
  })();
  const totalDur = scenes.reduce((a, b) => a + b.dur, 0);

  function renderScene(idx) {
    const overlay = document.getElementById('screenOverlay');
    overlay.classList.add('fade-out');
    setTimeout(() => {
      overlay.innerHTML = scenes[idx].html;
      overlay.classList.remove('fade-out');
    }, 200);

    document.getElementById('sceneBadge').textContent = scenes[idx].badge;
    document.getElementById('subText').textContent = scenes[idx].sub;
    updateJumpButtons(idx);
    updateStoryboard(idx);
  }

  function updateJumpButtons(idx) {
    scenes.forEach((_, i) => {
      const b = document.getElementById(`stepBtn_${i}`);
      if (b) b.className = `step-btn${i === idx ? ' active' : ''}`;
    });
  }

  function updateStoryboard(idx) {
    scenes.forEach((_, i) => {
      const card = document.getElementById(`sbCard_${i}`);
      if (card) card.className = `sb-item${i === idx ? ' active' : ''}`;
    });
  }

  function formatTime(sec) {
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(Math.floor(sec % 60)).padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateProgress() {
    const curTime = offsets[currentIdx] + elapsed;
    const pct = Math.min(100, (curTime / totalDur) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('timecode').textContent = `${formatTime(curTime)} / ${formatTime(totalDur)}`;
  }

  function tick(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const delta = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    elapsed += delta;
    updateProgress();

    if (elapsed >= scenes[currentIdx].dur) {
      elapsed = 0;
      if (currentIdx < scenes.length - 1) {
        currentIdx++;
        renderScene(currentIdx);
      } else {
        pause();
        return;
      }
    }
    if (isPlaying) rafId = requestAnimationFrame(tick);
  }

  function play() {
    isPlaying = true;
    lastTime = null;
    document.getElementById('playIconSvg').innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
    rafId = requestAnimationFrame(tick);
  }

  function pause() {
    isPlaying = false;
    document.getElementById('playIconSvg').innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
    cancelAnimationFrame(rafId);
  }

  window.togglePlay = function(e) {
    if (e) e.stopPropagation();
    if (isPlaying) pause();
    else play();
  };

  window.restart = function() {
    pause();
    currentIdx = 0;
    elapsed = 0;
    renderScene(0);
    updateProgress();
  };

  window.jumpTo = function(idx) {
    if (idx < 0 || idx >= scenes.length) return;
    pause();
    currentIdx = idx;
    elapsed = 0;
    renderScene(idx);
    updateProgress();
    play();
  };

  window.prevScene = function() { jumpTo(Math.max(0, currentIdx - 1)); };
  window.nextScene = function() { jumpTo(Math.min(scenes.length - 1, currentIdx + 1)); };

  window.seekClick = function(e) {
    const bar = document.getElementById('progressBar');
    const rect = bar.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const targetSec = ratio * totalDur;

    let targetIdx = scenes.length - 1;
    for (let i = 0; i < scenes.length; i++) {
      if (targetSec < offsets[i] + scenes[i].dur) {
        targetIdx = i;
        break;
      }
    }
    currentIdx = targetIdx;
    elapsed = targetSec - offsets[targetIdx];
    renderScene(currentIdx);
    updateProgress();
  };

  // Inicialización de botones del DOM
  const btnContainer = document.getElementById('stepButtons');
  btnContainer.innerHTML = scenes.map((_, i) =>
    `<button class="step-btn${i === 0 ? ' active' : ''}" id="stepBtn_${i}" onclick="jumpTo(${i})">${i + 1}</button>`
  ).join('');

  const sbContainer = document.getElementById('storyboardRow');
  sbContainer.innerHTML = scenes.map((s, i) =>
    `<div class="sb-item${i === 0 ? ' active' : ''}" id="sbCard_${i}" onclick="jumpTo(${i})">
       <div class="sb-tag">Escena ${i + 1}</div>
       <div class="sb-title">${s.badge.split('·')[1] || ''}</div>
       <div class="sb-time">${s.dur}s</div>
     </div>`
  ).join('');

  renderScene(0);
  updateProgress();
</script>

</body>
</html>
